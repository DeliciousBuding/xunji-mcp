version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      development-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # Cloudflare's test plugin pins a vitest major; bump it together.
      - dependency-name: vitest
        update-types:
          - version-update:semver-major
      # typescript-eslint 8.x peers cap TypeScript at <6.0.0.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
