name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate Worker types from the public example config
        run: |
          cp wrangler.example.jsonc wrangler.jsonc
          npx wrangler types
      - run: npm run typecheck
      - run: npm test
      - name: Secret scan (worktree and history)
        run: node scripts/secret-scan.mjs --history
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
